# FoundryOS AI — single-server production stack (e.g. one AWS EC2 instance).
#
#   cd deploy
#   cp .env.production.example .env      # fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy (ports 80/443) is reachable from the internet. PostgreSQL and the
# API listen on the internal Docker network only.

name: foundryos

x-backend-env: &backend-env
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  ENABLE_API_DOCS: "false"
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
  # The site itself plus, optionally, a separately hosted web client
  # (e.g. Cloudflare Pages: FRONTEND_ORIGIN=https://foundryos.pages.dev).
  CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?set SITE_DOMAIN},${FRONTEND_ORIGIN:-}
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_ACCOUNT_PASSWORD: ${PUBLIC_DEMO_PASSWORD:-}
  AI_REPORTS_ENABLED: ${AI_REPORTS_ENABLED:-false}
  AI_WORKFLOW_ENABLED: ${AI_WORKFLOW_ENABLED:-false}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: applies Alembic migrations on every deploy, then exits.
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ../backend
    restart: unless-stopped
    environment: *backend-env
    # Trust X-Forwarded-For from Caddy (the API port is not published), so sign-in
    # rate limits apply per visitor instead of to the proxy.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: https://${SITE_DOMAIN}/api/v1
        VITE_DEMO_PASSWORD: ${PUBLIC_DEMO_PASSWORD:-}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
